    <text x="29" y="82" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="760" letter-spacing="-1.5">ZAID ALASALI</text>
    <text x="31" y="121" fill="#C9D9E5" font-family="Segoe UI, Arial, sans-serif" font-size="19">Full-stack applications · Internal tools · AI integrations</text>
